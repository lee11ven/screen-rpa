[project]
name = "screen-rpa-backend"
version = "0.1.0"
description = "Screen RPA workflow API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "peewee>=3.17.0",
  "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]
ocr = [
  "paddleocr>=2.7.0,<3.0.0",
  "paddlepaddle>=2.6.2,<3.0.0",
  "opencv-python>=4.8.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
